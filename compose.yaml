services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: catalog_app
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: course_catalog
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_app -d course_catalog"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  catalog_data:
